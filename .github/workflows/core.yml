name: core

on:
  pull_request:
    paths: ["core/**", "settings.gradle.kts", ".github/workflows/core.yml"]
  push:
    branches: [main]
    paths: ["core/**", "settings.gradle.kts"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11" }
      - run: gradle :core:build
